apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
 name: aiops-cluster-reader

rules:
  - apiGroups: [""]
    resources:
     - pods
     - pods/log
     - events
     - namespaces
    verbs:
     - get 
     - watch
     - list 

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch



