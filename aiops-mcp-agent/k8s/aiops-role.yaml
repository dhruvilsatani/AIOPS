apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-reader
  namespace: default

rules:
  # Pods + Pod logs + Events
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch

  # Deployments
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch